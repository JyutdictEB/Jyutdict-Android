apply plugin: 'com.android.application'

def semanticVersion = providers.gradleProperty("appVersionName").get()
def semanticVersionMatcher = semanticVersion =~ /^(\d+)\.(\d+)\.(\d+)$/
if (!semanticVersionMatcher.matches()) {
    throw new GradleException("appVersionName must use major.minor.patch: ${semanticVersion}")
}
def versionMajor = semanticVersionMatcher.group(1).toInteger()
def versionMinor = semanticVersionMatcher.group(2).toInteger()
def versionPatch = semanticVersionMatcher.group(3).toInteger()
if (versionMinor > 99 || versionPatch > 99) {
    throw new GradleException("minor and patch must be between 0 and 99")
}
def semanticVersionCode = versionMajor * 10000 + versionMinor * 100 + versionPatch
if (semanticVersionCode <= 670) {
    throw new GradleException("versionCode must remain above previously released code 670")
}

android {
    compileSdkVersion 36

    defaultConfig {
        applicationId "cc.ecisr.jyutdict"
        minSdkVersion 23
        targetSdkVersion 36
        versionCode semanticVersionCode
        versionName semanticVersion

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = 18
        targetCompatibility = 18
    }
    namespace 'cc.ecisr.jyutdict'

}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.preference:preference:1.2.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'org.commonmark:commonmark:0.22.0'
    implementation 'org.commonmark:commonmark-ext-gfm-tables:0.22.0'

    // ViewPager2
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
}
